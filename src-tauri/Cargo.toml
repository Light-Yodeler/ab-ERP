[package]
name = "excel-subset-app"
version = "1.8.0"
description = "Aplikasi Desktop Subset-Sum Excel Ultra-Ringan"
authors = ["Muhammad Syahid Ramadhon"]
edition = "2021"

[lib]
name = "excel_subset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[test]]
name = "optimizer_tests"
path = "../tests/optimizer_tests.rs"
[[test]]
name = "smoke_verify"
path = "../tests/smoke_verify.rs"
[[test]]
name = "erp_core_tests"
path = "../tests/erp_core_tests.rs"
[[test]]
name = "certificate_tests"
path = "../tests/certificate_tests.rs"



[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
calamine = "0.38"
umya-spreadsheet = "3.1"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
chrono = "0.4"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
svg2pdf = "0.13"
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
tiny-skia = "0.11"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
